<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline';"
    />
    <title>Redline Writer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .title {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .title span {
        color: #ff3b30;
      }
      .rule {
        width: 190px;
        height: 2px;
        background: linear-gradient(90deg, #ff3b30, #333);
      }
      #status {
        font-size: 13px;
        color: #9a9a9a;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div class="title">REDLINE<span>·</span>WRITER</div>
    <div class="rule"></div>
    <div id="status">Starting…</div>
  </body>
</html>
