<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline';"
    />
    <title>Redline Writer</title>
    <style>
      /* Same two colours as the app and the icon — see frontend/src/theme.js.
         The splash is the first thing on screen, so any other shade here shows
         up as a flash of the wrong palette before the UI loads. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
        color: #ed0020;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .title {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .title span {
        color: #ed0020;
      }
      .rule {
        width: 190px;
        height: 2px;
        background: linear-gradient(90deg, #ed0020, rgba(237, 0, 32, 0));
      }
      #status {
        font-size: 13px;
        color: rgba(237, 0, 32, 0.7);
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div class="title">REDLINE<span>·</span>WRITER</div>
    <div class="rule"></div>
    <div id="status">Starting…</div>
  </body>
</html>
